name: Deploy Cloudflare

on:
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - name: Verify release
        run: npm test && npm run typecheck && npm run lint && npx prisma validate && npm run cf:build:web
      - name: Apply Neon migration
        run: npm run db:migrate
      - name: Deploy Jobs
        run: npm run cf:deploy:jobs
      - name: Deploy Core
        run: npm run cf:deploy:core
      - name: Deploy Web
        run: npm run cf:deploy:web
