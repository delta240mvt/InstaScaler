name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npx prisma validate
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run cf:build:web
      - run: npx wrangler deploy --dry-run --outdir dist/core --config wrangler.core.jsonc
      - run: npx wrangler deploy --dry-run --outdir dist/jobs --config wrangler.jobs.jsonc
      - run: npx wrangler deploy --dry-run --config wrangler.web.jsonc
      - run: node scripts/check-worker-size.mjs .open-next/worker.js dist/core dist/jobs
        env:
          WORKER_GZIP_LIMIT_BYTES: "3145728"
